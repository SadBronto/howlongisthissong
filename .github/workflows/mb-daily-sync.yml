name: MusicBrainz daily sync

on:
  schedule:
    # 06:00 UTC daily — MB publishes new replication packets around 05:00 UTC
    - cron: '0 6 * * *'
  # Allow manual trigger from the GitHub Actions UI (useful for first run / catch-up)
  workflow_dispatch:

jobs:
  sync:
    name: Sync new recordings from MusicBrainz
    runs-on: ubuntu-latest
    timeout-minutes: 120  # allow up to 2h; ~1000 new recordings/day × 1s each ≈ 17 min typical

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run daily sync
        run: npm run sync-mb-daily
        env:
          CLOUDFLARE_ACCOUNT_ID:     ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:      ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
