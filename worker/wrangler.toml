name               = "howlongisthissong-search"
main               = "src/index.ts"
compatibility_date = "2024-09-23"

[[d1_databases]]
binding       = "DB"
database_name = "howlongisthissong"
database_id   = "c4fa886f-3387-4f3f-baa1-a2a56954b836"

# Per-IP rate limit: 100 requests / 60s. Far above any human's search rate —
# only scripted abuse/scraping loops trip it. (period must be 10 or 60.)
[[unsafe.bindings]]
name         = "RATE_LIMITER"
type         = "ratelimit"
namespace_id = "1001"
simple       = { limit = 100, period = 60 }

[triggers]
crons = ["* * * * *"]
